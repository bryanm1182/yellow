<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Feliz día de las flores amarillas 😊</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        #universo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
        }

        .titulo {
            position: fixed;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            width: 90%;

            text-align: center;
            color: #fff6a5;

            font-size: clamp(1.7rem, 5vw, 3.4rem);
            font-weight: 600;

            text-shadow:
                0 0 8px #ffd500,
                0 0 18px #ffbf00,
                0 0 35px #ff9900;

            pointer-events: none;

            animation: brillo 3s ease-in-out infinite alternate;
        }

        @keyframes brillo {
            from {
                opacity: 0.8;
                transform: translateX(-50%) scale(1);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) scale(1.035);
            }
        }

        .viñeta {
            position: fixed;
            inset: 0;

            pointer-events: none;
            z-index: 5;

            background:
                radial-gradient(
                    circle at center,
                    transparent 35%,
                    rgba(0, 0, 0, 0.20) 65%,
                    rgba(0, 0, 0, 0.75) 100%
                );
        }
    </style>
</head>

<body>

    <div id="universo"></div>

    <div class="titulo">
        Feliz día de las flores amarillas 😊
    </div>

    <div class="viñeta"></div>


    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
    }
    </script>


    <script type="module">

        import * as THREE from "three";

        import {
            OrbitControls
        } from "three/addons/controls/OrbitControls.js";


        /* ======================================================
           ESCENA
        ====================================================== */

        const contenedor = document.getElementById("universo");

        const escena = new THREE.Scene();

        escena.fog = new THREE.FogExp2(
            0x000000,
            0.003
        );


        /* ======================================================
           CÁMARA
        ====================================================== */

        const camara = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camara.position.set(
            0,
            15,
            85
        );


        /* ======================================================
           RENDER
        ====================================================== */

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );

        renderer.outputColorSpace =
            THREE.SRGBColorSpace;

        renderer.setClearColor(
            0x000000,
            1
        );

        contenedor.appendChild(
            renderer.domElement
        );


        /* ======================================================
           CONTROLES
        ====================================================== */

        const controles = new OrbitControls(
            camara,
            renderer.domElement
        );

        controles.enableDamping = true;

        controles.dampingFactor = 0.045;

        controles.enablePan = false;

        controles.enableZoom = true;

        controles.minDistance = 18;

        controles.maxDistance = 150;

        controles.autoRotate = true;

        controles.autoRotateSpeed = 0.22;

        controles.target.set(
            0,
            0,
            0
        );


        /* ======================================================
           UNIVERSO GENERAL
        ====================================================== */

        const universo = new THREE.Group();

        escena.add(
            universo
        );


        /* ======================================================
           CREAR TEXTURA DE LUZ
        ====================================================== */

        function crearTexturaLuz() {

            const canvas =
                document.createElement("canvas");

            canvas.width = 128;
            canvas.height = 128;

            const ctx =
                canvas.getContext("2d");

            const degradado =
                ctx.createRadialGradient(
                    64,
                    64,
                    0,
                    64,
                    64,
                    64
                );

            degradado.addColorStop(
                0,
                "rgba(255,255,220,1)"
            );

            degradado.addColorStop(
                0.15,
                "rgba(255,240,70,1)"
            );

            degradado.addColorStop(
                0.40,
                "rgba(255,190,0,0.65)"
            );

            degradado.addColorStop(
                1,
                "rgba(255,150,0,0)"
            );

            ctx.fillStyle =
                degradado;

            ctx.fillRect(
                0,
                0,
                128,
                128
            );

            return new THREE.CanvasTexture(
                canvas
            );
        }


        const texturaLuz =
            crearTexturaLuz();


        /* ======================================================
           ESTRELLAS DEL FONDO
        ====================================================== */

        function crearEstrellas() {

            const cantidad = 3500;

            const posiciones =
                new Float32Array(
                    cantidad * 3
                );

            const colores =
                new Float32Array(
                    cantidad * 3
                );

            const color =
                new THREE.Color();

            for (
                let i = 0;
                i < cantidad;
                i++
            ) {

                const radio =
                    80 +
                    Math.random() * 250;

                const theta =
                    Math.random() *
                    Math.PI *
                    2;

                const phi =
                    Math.acos(
                        2 *
                        Math.random()
                        - 1
                    );

                posiciones[
                    i * 3
                ] =
                    radio *
                    Math.sin(phi) *
                    Math.cos(theta);

                posiciones[
                    i * 3 + 1
                ] =
                    radio *
                    Math.cos(phi);

                posiciones[
                    i * 3 + 2
                ] =
                    radio *
                    Math.sin(phi) *
                    Math.sin(theta);


                const variante =
                    Math.random();

                if (
                    variante > 0.75
                ) {

                    color.set(
                        0xffe46b
                    );

                } else {

                    color.set(
                        0xffffff
                    );

                }


                colores[
                    i * 3
                ] =
                    color.r;

                colores[
                    i * 3 + 1
                ] =
                    color.g;

                colores[
                    i * 3 + 2
                ] =
                    color.b;
            }


            const geometria =
                new THREE.BufferGeometry();

            geometria.setAttribute(
                "position",
                new THREE.BufferAttribute(
                    posiciones,
                    3
                )
            );

            geometria.setAttribute(
                "color",
                new THREE.BufferAttribute(
                    colores,
                    3
                )
            );


            const material =
                new THREE.PointsMaterial({

                    size: 0.75,

                    map: texturaLuz,

                    transparent: true,

                    opacity: 0.8,

                    vertexColors: true,

                    blending:
                        THREE.AdditiveBlending,

                    depthWrite: false

                });


            const estrellas =
                new THREE.Points(
                    geometria,
                    material
                );

            escena.add(
                estrellas
            );

            return estrellas;
        }


        const estrellas =
            crearEstrellas();


        /* ======================================================
           GALAXIA AMARILLA
        ====================================================== */

        function crearGalaxia() {

            const cantidad =
                window.innerWidth < 700
                ? 6500
                : 11000;

            const brazos = 5;

            const radioMaximo = 52;

            const posiciones =
                new Float32Array(
                    cantidad * 3
                );

            const colores =
                new Float32Array(
                    cantidad * 3
                );

            const colorInterior =
                new THREE.Color(
                    0xffffbb
                );

            const colorExterior =
                new THREE.Color(
                    0xffa500
                );


            for (
                let i = 0;
                i < cantidad;
                i++
            ) {

                const radio =
                    Math.pow(
                        Math.random(),
                        0.65
                    ) *
                    radioMaximo;


                const brazo =
                    i % brazos;


                const anguloBrazo =
                    (
                        brazo /
                        brazos
                    ) *
                    Math.PI *
                    2;


                const giro =
                    radio *
                    0.23;


                const dispersion =
                    (
                        Math.random() -
                        0.5
                    ) *
                    (
                        2 +
                        radio *
                        0.10
                    );


                const dispersionZ =
                    (
                        Math.random() -
                        0.5
                    ) *
                    (
                        1.5 +
                        radio *
                        0.05
                    );


                const angulo =
                    anguloBrazo +
                    giro +
                    dispersion *
                    0.08;


                const x =
                    Math.cos(
                        angulo
                    ) *
                    radio +
                    dispersion;


                const z =
                    Math.sin(
                        angulo
                    ) *
                    radio +
                    dispersion;


                const y =
                    dispersionZ;


                posiciones[
                    i * 3
                ] = x;

                posiciones[
                    i * 3 + 1
                ] = y;

                posiciones[
                    i * 3 + 2
                ] = z;


                const mezcla =
                    radio /
                    radioMaximo;


                const color =
                    colorInterior
                    .clone()
                    .lerp(
                        colorExterior,
                        mezcla
                    );


                colores[
                    i * 3
                ] =
                    color.r;

                colores[
                    i * 3 + 1
                ] =
                    color.g;

                colores[
                    i * 3 + 2
                ] =
                    color.b;
            }


            const geometria =
                new THREE.BufferGeometry();

            geometria.setAttribute(
                "position",
                new THREE.BufferAttribute(
                    posiciones,
                    3
                )
            );

            geometria.setAttribute(
                "color",
                new THREE.BufferAttribute(
                    colores,
                    3
                )
            );


            const material =
                new THREE.PointsMaterial({

                    size: 1.05,

                    map: texturaLuz,

                    transparent: true,

                    opacity: 0.82,

                    vertexColors: true,

                    blending:
                        THREE.AdditiveBlending,

                    depthWrite: false

                });


            const galaxia =
                new THREE.Points(
                    geometria,
                    material
                );


            universo.add(
                galaxia
            );


            return galaxia;
        }


        const galaxia =
            crearGalaxia();


        /* ======================================================
           TEXTURA DE FLOR
        ====================================================== */

        function crearTexturaFlor() {

            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.width =
                256;

            canvas.height =
                256;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            ctx.translate(
                128,
                128
            );


            /* PÉTALOS */

            for (
                let i = 0;
                i < 16;
                i++
            ) {

                ctx.save();

                ctx.rotate(
                    (
                        i /
                        16
                    ) *
                    Math.PI *
                    2
                );


                const gradiente =
                    ctx.createRadialGradient(
                        0,
                        -58,
                        3,
                        0,
                        -58,
                        48
                    );

                gradiente.addColorStop(
                    0,
                    "#fff76a"
                );

                gradiente.addColorStop(
                    0.45,
                    "#ffd500"
                );

                gradiente.addColorStop(
                    1,
                    "#e89b00"
                );


                ctx.fillStyle =
                    gradiente;


                ctx.beginPath();

                ctx.ellipse(
                    0,
                    -57,
                    19,
                    48,
                    0,
                    0,
                    Math.PI *
                    2
                );

                ctx.fill();

                ctx.restore();
            }


            /* CENTRO */

            const centro =
                ctx.createRadialGradient(
                    0,
                    0,
                    5,
                    0,
                    0,
                    42
                );

            centro.addColorStop(
                0,
                "#6c3b00"
            );

            centro.addColorStop(
                0.5,
                "#5a2b00"
            );

            centro.addColorStop(
                1,
                "#2b1200"
            );


            ctx.fillStyle =
                centro;


            ctx.beginPath();

            ctx.arc(
                0,
                0,
                40,
                0,
                Math.PI *
                2
            );

            ctx.fill();


            /* PUNTOS DEL CENTRO */

            for (
                let i = 0;
                i < 70;
                i++
            ) {

                const a =
                    Math.random() *
                    Math.PI *
                    2;

                const r =
                    Math.random() *
                    32;


                ctx.fillStyle =
                    "rgba(255,190,0,0.8)";


                ctx.beginPath();

                ctx.arc(
                    Math.cos(a) *
                    r,

                    Math.sin(a) *
                    r,

                    1 +
                    Math.random() *
                    2,

                    0,

                    Math.PI *
                    2
                );

                ctx.fill();
            }


            const textura =
                new THREE.CanvasTexture(
                    canvas
                );


            textura.colorSpace =
                THREE.SRGBColorSpace;


            return textura;
        }


        const texturaFlor =
            crearTexturaFlor();


        /* ======================================================
           FLORES FLOTANDO POR LA GALAXIA
        ====================================================== */

        const grupoFlores =
            new THREE.Group();


        universo.add(
            grupoFlores
        );


        const cantidadFlores =
            window.innerWidth < 700
            ? 70
            : 125;


        const flores = [];


        for (
            let i = 0;
            i < cantidadFlores;
            i++
        ) {

            const material =
                new THREE.SpriteMaterial({

                    map:
                        texturaFlor,

                    transparent:
                        true,

                    opacity:
                        0.94,

                    depthWrite:
                        false

                });


            const flor =
                new THREE.Sprite(
                    material
                );


            const radio =
                8 +
                Math.random() *
                45;


            const angulo =
                Math.random() *
                Math.PI *
                2;


            flor.position.set(

                Math.cos(angulo) *
                radio,

                (
                    Math.random() -
                    0.5
                ) *
                12,

                Math.sin(angulo) *
                radio

            );


            const escala =
                1.1 +
                Math.random() *
                2.8;


            flor.scale.set(
                escala,
                escala,
                escala
            );


            flor.userData = {

                velocidad:
                    0.0004 +
                    Math.random() *
                    0.001,

                radio:
                    radio,

                angulo:
                    angulo,

                altura:
                    flor.position.y,

                oscilacion:
                    Math.random() *
                    Math.PI *
                    2

            };


            flores.push(
                flor
            );


            grupoFlores.add(
                flor
            );
        }


        /* ======================================================
           CORAZÓN DE PARTÍCULAS
        ====================================================== */

        function crearCorazon() {

            const cantidad =
                2600;


            const posiciones =
                new Float32Array(
                    cantidad *
                    3
                );


            for (
                let i = 0;
                i < cantidad;
                i++
            ) {

                const t =
                    Math.random() *
                    Math.PI *
                    2;


                const escala =
                    0.72;


                let x =
                    16 *
                    Math.pow(
                        Math.sin(t),
                        3
                    );


                let y =
                    13 *
                    Math.cos(t)
                    -
                    5 *
                    Math.cos(
                        2 * t
                    )
                    -
                    2 *
                    Math.cos(
                        3 * t
                    )
                    -
                    Math.cos(
                        4 * t
                    );


                const grosor =
                    Math.random() *
                    2.2;


                x +=
                    (
                        Math.random() -
                        0.5
                    ) *
                    grosor;


                y +=
                    (
                        Math.random() -
                        0.5
                    ) *
                    grosor;


                posiciones[
                    i * 3
                ] =
                    x *
                    escala;


                posiciones[
                    i * 3 + 1
                ] =
                    y *
                    escala +
                    5;


                posiciones[
                    i * 3 + 2
                ] =
                    (
                        Math.random() -
                        0.5
                    ) *
                    2.5;
            }


            const geometria =
                new THREE.BufferGeometry();


            geometria.setAttribute(

                "position",

                new THREE.BufferAttribute(
                    posiciones,
                    3
                )

            );


            const material =
                new THREE.PointsMaterial({

                    size:
                        1.05,

                    map:
                        texturaLuz,

                    color:
                        0xffd900,

                    transparent:
                        true,

                    opacity:
                        0.9,

                    blending:
                        THREE.AdditiveBlending,

                    depthWrite:
                        false

                });


            const corazon =
                new THREE.Points(
                    geometria,
                    material
                );


            corazon.rotation.x =
                -0.05;


            universo.add(
                corazon
            );


            return corazon;
        }


        const corazon =
            crearCorazon();


        /* ======================================================
           NÚCLEO BRILLANTE
        ====================================================== */

        const materialNucleo =
            new THREE.SpriteMaterial({

                map:
                    texturaLuz,

                color:
                    0xffdf00,

                transparent:
                    true,

                opacity:
                    0.75,

                blending:
                    THREE.AdditiveBlending,

                depthWrite:
                    false

            });


        const nucleo =
            new THREE.Sprite(
                materialNucleo
            );


        nucleo.scale.set(
            18,
            18,
            18
        );


        nucleo.position.set(
            0,
            -5,
            0
        );


        universo.add(
            nucleo
        );


        /* ======================================================
           POLVO QUE SUBE DESDE EL CENTRO
        ====================================================== */

        function crearColumnaDeLuz() {

            const cantidad =
                1800;


            const posiciones =
                new Float32Array(
                    cantidad *
                    3
                );


            for (
                let i = 0;
                i < cantidad;
                i++
            ) {

                const altura =
                    Math.random() *
                    45;


                const radio =
                    (
                        1 -
                        altura /
                        55
                    ) *
                    5 +
                    0.5;


                const angulo =
                    Math.random() *
                    Math.PI *
                    2;


                posiciones[
                    i * 3
                ] =
                    Math.cos(
                        angulo
                    ) *
                    Math.random() *
                    radio;


                posiciones[
                    i * 3 + 1
                ] =
                    altura -
                    5;


                posiciones[
                    i * 3 + 2
                ] =
                    Math.sin(
                        angulo
                    ) *
                    Math.random() *
                    radio;
            }


            const geometria =
                new THREE.BufferGeometry();


            geometria.setAttribute(

                "position",

                new THREE.BufferAttribute(
                    posiciones,
                    3
                )

            );


            const material =
                new THREE.PointsMaterial({

                    size:
                        0.8,

                    map:
                        texturaLuz,

                    color:
                        0xffe55c,

                    transparent:
                        true,

                    opacity:
                        0.52,

                    blending:
                        THREE.AdditiveBlending,

                    depthWrite:
                        false

                });


            const columna =
                new THREE.Points(
                    geometria,
                    material
                );


            universo.add(
                columna
            );


            return columna;
        }


        const columna =
            crearColumnaDeLuz();


        /* ======================================================
           MOVIMIENTO DEL MOUSE
        ====================================================== */

        let mouseX = 0;
        let mouseY = 0;


        window.addEventListener(
            "mousemove",
            function (event) {

                mouseX =
                    (
                        event.clientX /
                        window.innerWidth
                        -
                        0.5
                    );


                mouseY =
                    (
                        event.clientY /
                        window.innerHeight
                        -
                        0.5
                    );

            }
        );


        /* ======================================================
           ANIMACIÓN
        ====================================================== */

        const reloj =
            new THREE.Clock();


        function animar() {

            requestAnimationFrame(
                animar
            );


            const tiempo =
                reloj.getElapsedTime();


            galaxia.rotation.y +=
                0.0006;


            grupoFlores.rotation.y +=
                0.00035;


            estrellas.rotation.y -=
                0.00004;


            columna.rotation.y +=
                0.001;


            corazon.rotation.y =
                Math.sin(
                    tiempo *
                    0.45
                ) *
                0.13;


            const latido =
                1 +
                Math.sin(
                    tiempo *
                    2
                ) *
                0.025;


            corazon.scale.set(
                latido,
                latido,
                latido
            );


            const pulsoNucleo =
                16 +
                Math.sin(
                    tiempo *
                    1.7
                ) *
                3;


            nucleo.scale.set(
                pulsoNucleo,
                pulsoNucleo,
                pulsoNucleo
            );


            flores.forEach(
                (flor) => {

                    flor.userData.angulo +=
                        flor.userData.velocidad;


                    flor.position.x =
                        Math.cos(
                            flor.userData.angulo
                        ) *
                        flor.userData.radio;


                    flor.position.z =
                        Math.sin(
                            flor.userData.angulo
                        ) *
                        flor.userData.radio;


                    flor.position.y =
                        flor.userData.altura +
                        Math.sin(
                            tiempo *
                            0.7 +
                            flor.userData.oscilacion
                        ) *
                        1.5;

                }
            );


            universo.rotation.x +=
                (
                    mouseY *
                    0.04 -
                    universo.rotation.x
                ) *
                0.015;


            controles.update();


            renderer.render(
                escena,
                camara
            );
        }


        animar();


        /* ======================================================
           RESPONSIVE
        ====================================================== */

        window.addEventListener(
            "resize",
            function () {

                camara.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camara.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );

    </script>

</body>
</html>
