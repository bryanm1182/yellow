<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Feliz día de las flores amarillas 😊</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(
        180deg,
        #dff6ff 0%,
        #bfe9ff 35%,
        #8fd2ff 70%,
        #74c4ff 100%
      );
    }

    #universo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
    }

    .overlay {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 92%;
      text-align: center;
      pointer-events: none;
    }

    .overlay h1 {
      font-size: clamp(1.7rem, 4.4vw, 3.8rem);
      font-weight: 700;
      color: #ffd52e;
      text-shadow:
        0 0 8px rgba(255, 208, 0, 0.55),
        0 0 18px rgba(255, 208, 0, 0.35),
        0 0 32px rgba(255, 208, 0, 0.18);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .overlay p {
      font-size: clamp(0.95rem, 2vw, 1.45rem);
      font-weight: 700;
      color: #fff9d8;
      text-shadow:
        0 0 6px rgba(173, 123, 0, 0.20),
        0 0 12px rgba(255, 210, 71, 0.18);
      letter-spacing: 2px;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        radial-gradient(circle at center, transparent 48%, rgba(255,255,255,0.04) 65%, rgba(0,0,0,0.14) 100%);
    }
  </style>
</head>
<body>
  <div id="universo"></div>

  <div class="overlay">
    <h1>Feliz día de las flores amarillas 😊</h1>
    <p>MI AMIGA NO SERA ESPECTADORA</p>
  </div>

  <div class="vignette"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const contenedor = document.getElementById("universo");

    const escena = new THREE.Scene();
    escena.fog = new THREE.FogExp2(0xa7ddff, 0.0032);

    const camara = new THREE.PerspectiveCamera(
      58,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0xbfe9ff, 1);
    contenedor.appendChild(renderer.domElement);

    const controles = new OrbitControls(camara, renderer.domElement);
    controles.enableDamping = true;
    controles.dampingFactor = 0.045;
    controles.enablePan = false;
    controles.enableZoom = true;
    controles.minDistance = 24;
    controles.maxDistance = 120;
    controles.autoRotate = true;
    controles.autoRotateSpeed = 0.28;
    controles.target.set(0, 0, 0);
    controles.enabled = false;

    const universo = new THREE.Group();
    escena.add(universo);

    function crearTexturaLuz(colorInterno = "#fffde6", colorMedio = "#ffd64f", colorExterior = "rgba(255,204,0,0)") {
      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");

      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, colorInterno);
      grad.addColorStop(0.28, colorMedio);
      grad.addColorStop(1, colorExterior);

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);

      return new THREE.CanvasTexture(canvas);
    }

    const texturaLuz = crearTexturaLuz();
    const texturaBrisa = crearTexturaLuz("#ffffff", "rgba(255,255,255,0.75)", "rgba(255,255,255,0)");

    function crearEstrellasSuaves() {
      const cantidad = 900;
      const posiciones = new Float32Array(cantidad * 3);
      const colores = new Float32Array(cantidad * 3);
      const color = new THREE.Color();

      for (let i = 0; i < cantidad; i++) {
        const radio = 70 + Math.random() * 190;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        posiciones[i * 3] = radio * Math.sin(phi) * Math.cos(theta);
        posiciones[i * 3 + 1] = radio * Math.cos(phi);
        posiciones[i * 3 + 2] = radio * Math.sin(phi) * Math.sin(theta);

        if (Math.random() > 0.8) {
          color.set("#ffe27a");
        } else {
          color.set("#ffffff");
        }

        colores[i * 3] = color.r;
        colores[i * 3 + 1] = color.g;
        colores[i * 3 + 2] = color.b;
      }

      const geometria = new THREE.BufferGeometry();
      geometria.setAttribute("position", new THREE.BufferAttribute(posiciones, 3));
      geometria.setAttribute("color", new THREE.BufferAttribute(colores, 3));

      const material = new THREE.PointsMaterial({
        size: 0.75,
        map: texturaBrisa,
        transparent: true,
        opacity: 0.55,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const puntos = new THREE.Points(geometria, material);
      escena.add(puntos);
      return puntos;
    }

    const estrellas = crearEstrellasSuaves();

    function crearGalaxiaElegante() {
      const cantidad = window.innerWidth < 700 ? 2600 : 4200;
      const brazos = 5;
      const radioMax = 38;

      const posiciones = new Float32Array(cantidad * 3);
      const colores = new Float32Array(cantidad * 3);

      const colorCentro = new THREE.Color("#fff8b8");
      const colorExterior = new THREE.Color("#dca100");

      for (let i = 0; i < cantidad; i++) {
        const radio = Math.pow(Math.random(), 0.72) * radioMax;
        const brazo = i % brazos;
        const anguloBrazo = (brazo / brazos) * Math.PI * 2;
        const torsion = radio * 0.34;
        const dispersion = (Math.random() - 0.5) * (1.2 + radio * 0.08);
        const altura = (Math.random() - 0.5) * (0.8 + radio * 0.03);
        const angulo = anguloBrazo + torsion + dispersion * 0.11;

        const x = Math.cos(angulo) * radio + dispersion;
        const z = Math.sin(angulo) * radio + dispersion;
        const y = altura - 4.5;

        posiciones[i * 3] = x;
        posiciones[i * 3 + 1] = y;
        posiciones[i * 3 + 2] = z;

        const mezcla = radio / radioMax;
        const color = colorCentro.clone().lerp(colorExterior, mezcla);

        colores[i * 3] = color.r;
        colores[i * 3 + 1] = color.g;
        colores[i * 3 + 2] = color.b;
      }

      const geometria = new THREE.BufferGeometry();
      geometria.setAttribute("position", new THREE.BufferAttribute(posiciones, 3));
      geometria.setAttribute("color", new THREE.BufferAttribute(colores, 3));

      const material = new THREE.PointsMaterial({
        size: 0.9,
        map: texturaLuz,
        transparent: true,
        opacity: 0.8,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const galaxia = new THREE.Points(geometria, material);
      universo.add(galaxia);
      return galaxia;
    }

    const galaxia = crearGalaxiaElegante();

    function crearTexturaFlor() {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      ctx.translate(128, 128);

      for (let i = 0; i < 14; i++) {
        ctx.save();
        ctx.rotate((i / 14) * Math.PI * 2);

        const petalo = ctx.createRadialGradient(0, -52, 4, 0, -52, 38);
        petalo.addColorStop(0, "#fff68b");
        petalo.addColorStop(0.45, "#ffd93c");
        petalo.addColorStop(1, "#dca100");

        ctx.fillStyle = petalo;
        ctx.beginPath();
        ctx.ellipse(0, -52, 16, 40, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const centro = ctx.createRadialGradient(0, 0, 4, 0, 0, 34);
      centro.addColorStop(0, "#7a4700");
      centro.addColorStop(0.55, "#5c3100");
      centro.addColorStop(1, "#2a1200");

      ctx.fillStyle = centro;
      ctx.beginPath();
      ctx.arc(0, 0, 32, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < 45; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * 24;
        ctx.fillStyle = "rgba(255,190,0,0.75)";
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 1 + Math.random() * 1.6, 0, Math.PI * 2);
        ctx.fill();
      }

      const textura = new THREE.CanvasTexture(canvas);
      textura.colorSpace = THREE.SRGBColorSpace;
      return textura;
    }

    const texturaFlor = crearTexturaFlor();

    const grupoFlores = new THREE.Group();
    universo.add(grupoFlores);

    const cantidadFlores = window.innerWidth < 700 ? 28 : 42;
    const flores = [];

    for (let i = 0; i < cantidadFlores; i++) {
      const material = new THREE.SpriteMaterial({
        map: texturaFlor,
        transparent: true,
        opacity: 0.92,
        depthWrite: false
      });

      const flor = new THREE.Sprite(material);

      const radio = 7 + Math.random() * 34;
      const angulo = Math.random() * Math.PI * 2;
      const altura = (Math.random() - 0.5) * 7 - 2;

      flor.position.set(
        Math.cos(angulo) * radio,
        altura,
        Math.sin(angulo) * radio
      );

      const escala = 1 + Math.random() * 2.2;
      flor.scale.set(escala, escala, escala);

      flor.userData = {
        velocidad: 0.00045 + Math.random() * 0.00075,
        radio,
        angulo,
        altura,
        oscilacion: Math.random() * Math.PI * 2
      };

      flores.push(flor);
      grupoFlores.add(flor);
    }

    function crearCorazonSutil() {
      const cantidad = 1100;
      const posiciones = new Float32Array(cantidad * 3);

      for (let i = 0; i < cantidad; i++) {
        const t = Math.random() * Math.PI * 2;
        const escala = 0.48;

        let x = 16 * Math.pow(Math.sin(t), 3);
        let y =
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t);

        const grosor = Math.random() * 1.2;

        x += (Math.random() - 0.5) * grosor;
        y += (Math.random() - 0.5) * grosor;

        posiciones[i * 3] = x * escala;
        posiciones[i * 3 + 1] = y * escala + 4.5;
        posiciones[i * 3 + 2] = (Math.random() - 0.5) * 1.3;
      }

      const geometria = new THREE.BufferGeometry();
      geometria.setAttribute("position", new THREE.BufferAttribute(posiciones, 3));

      const material = new THREE.PointsMaterial({
        size: 0.78,
        map: texturaLuz,
        color: 0xffd338,
        transparent: true,
        opacity: 0.82,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const corazon = new THREE.Points(geometria, material);
      universo.add(corazon);
      return corazon;
    }

    const corazon = crearCorazonSutil();

    const nucleoMaterial = new THREE.SpriteMaterial({
      map: texturaLuz,
      color: 0xffd438,
      transparent: true,
      opacity: 0.52,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const nucleo = new THREE.Sprite(nucleoMaterial);
    nucleo.scale.set(10, 10, 10);
    nucleo.position.set(0, -4.8, 0);
    universo.add(nucleo);

    function crearColumnaLigera() {
      const cantidad = 520;
      const posiciones = new Float32Array(cantidad * 3);

      for (let i = 0; i < cantidad; i++) {
        const altura = Math.random() * 28;
        const radio = (1 - altura / 32) * 2 + 0.35;
        const angulo = Math.random() * Math.PI * 2;

        posiciones[i * 3] = Math.cos(angulo) * Math.random() * radio;
        posiciones[i * 3 + 1] = altura + 3;
        posiciones[i * 3 + 2] = Math.sin(angulo) * Math.random() * radio;
      }

      const geometria = new THREE.BufferGeometry();
      geometria.setAttribute("position", new THREE.BufferAttribute(posiciones, 3));

      const material = new THREE.PointsMaterial({
        size: 0.72,
        map: texturaLuz,
        color: 0xffd94d,
        transparent: true,
        opacity: 0.48,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const columna = new THREE.Points(geometria, material);
      universo.add(columna);
      return columna;
    }

    const columna = crearColumnaLigera();

    let mouseY = 0;

    window.addEventListener("mousemove", (event) => {
      mouseY = event.clientY / window.innerHeight - 0.5;
    });

    const reloj = new THREE.Clock();

    const intro = {
      activa: true,
      duracion: 4.8,
      inicioZ: 145,
      finZ: 78,
      inicioY: 26,
      finY: 12
    };

    camara.position.set(0, intro.inicioY, intro.inicioZ);

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function animar() {
      requestAnimationFrame(animar);

      const tiempo = reloj.getElapsedTime();

      if (intro.activa) {
        const progreso = Math.min(tiempo / intro.duracion, 1);
        const suave = easeOutCubic(progreso);

        camara.position.z = intro.inicioZ + (intro.finZ - intro.inicioZ) * suave;
        camara.position.y = intro.inicioY + (intro.finY - intro.inicioY) * suave;
        camara.lookAt(0, 0, 0);

        if (progreso >= 1) {
          intro.activa = false;
          controles.enabled = true;
        }
      }

      galaxia.rotation.y += 0.0008;
      grupoFlores.rotation.y += 0.00042;
      estrellas.rotation.y -= 0.00005;
      columna.rotation.y += 0.0012;

      const latido = 1 + Math.sin(tiempo * 2) * 0.018;
      corazon.scale.set(latido, latido, latido);
      corazon.rotation.y = Math.sin(tiempo * 0.55) * 0.12;

      const pulso = 8.5 + Math.sin(tiempo * 1.8) * 1.2;
      nucleo.scale.set(pulso, pulso, pulso);

      flores.forEach((flor) => {
        flor.userData.angulo += flor.userData.velocidad;
        flor.position.x = Math.cos(flor.userData.angulo) * flor.userData.radio;
        flor.position.z = Math.sin(flor.userData.angulo) * flor.userData.radio;
        flor.position.y =
          flor.userData.altura +
          Math.sin(tiempo * 0.7 + flor.userData.oscilacion) * 0.75;
      });

      universo.rotation.x += (mouseY * 0.035 - universo.rotation.x) * 0.012;

      controles.update();
      renderer.render(escena, camara);
    }

    animar();

    window.addEventListener("resize", () => {
      camara.aspect = window.innerWidth / window.innerHeight;
      camara.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
