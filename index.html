<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Feliz día de las flores amarillas 😊</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #universo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
    }

    /* ===============================
       TEXTOS
    =============================== */
    .titulo {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      width: 92%;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .titulo.visible {
      opacity: 1;
    }

    .titulo h1 {
      font-size: clamp(1.7rem, 4.5vw, 3.8rem);
      font-weight: 700;
      color: #d8a300;
      text-shadow:
        0 0 8px rgba(216, 163, 0, 0.35),
        0 0 16px rgba(216, 163, 0, 0.18);
      letter-spacing: 0.4px;
    }

    .pie {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 12;
      width: 92%;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .pie.visible {
      opacity: 1;
    }

    .pie p {
      font-size: clamp(0.95rem, 1.8vw, 1.25rem);
      font-weight: 700;
      color: #c59a1a;
      letter-spacing: 2px;
      text-shadow:
        0 0 6px rgba(197, 154, 26, 0.25),
        0 0 12px rgba(197, 154, 26, 0.12);
    }

    /* ===============================
       PANTALLA INICIAL
    =============================== */
    .inicio {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center,
          rgba(35, 35, 35, 0.30) 0%,
          rgba(0, 0, 0, 0.82) 45%,
          rgba(0, 0, 0, 0.96) 100%);
      cursor: pointer;
      transition: opacity 0.9s ease;
    }

    .inicio.ocultar {
      opacity: 0;
      pointer-events: none;
    }

    .inicio-contenido {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      transform: translateY(-10px);
    }

    .flor-inicial {
      width: clamp(110px, 18vw, 180px);
      height: clamp(110px, 18vw, 180px);
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      filter: drop-shadow(0 0 16px rgba(255, 210, 50, 0.45));
      animation: palpitar 1.7s ease-in-out infinite;
    }

    .toque {
      font-size: clamp(1rem, 2.2vw, 1.35rem);
      color: #d8a300;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow:
        0 0 7px rgba(216, 163, 0, 0.28),
        0 0 12px rgba(216, 163, 0, 0.14);
      animation: parpadeo 1.6s ease-in-out infinite;
    }

    @keyframes palpitar {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes parpadeo {
      0%   { opacity: 0.5; }
      50%  { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .viñeta {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background:
        radial-gradient(circle at center,
          transparent 52%,
          rgba(0, 0, 0, 0.10) 72%,
          rgba(0, 0, 0, 0.45) 100%);
    }
  </style>
</head>
<body>
  <div id="universo"></div>

  <div class="titulo" id="titulo">
    <h1>Feliz día de las flores amarillas 😊</h1>
  </div>

  <div class="pie" id="pie">
    <p>MI AMIGA NO SERA ESPECTADORA</p>
  </div>

  <div class="inicio" id="inicio">
    <div class="inicio-contenido">
      <div class="flor-inicial" id="florInicial"></div>
      <div class="toque">Toque aquí</div>
    </div>
  </div>

  <div class="viñeta"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const contenedor = document.getElementById("universo");
    const inicio = document.getElementById("inicio");
    const florInicialDOM = document.getElementById("florInicial");
    const titulo = document.getElementById("titulo");
    const pie = document.getElementById("pie");

    const escena = new THREE.Scene();
    escena.fog = new THREE.FogExp2(0x000000, 0.0035);

    const camara = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camara.position.set(0, 0, 16);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 1);
    contenedor.appendChild(renderer.domElement);

    const controles = new OrbitControls(camara, renderer.domElement);
    controles.enableDamping = true;
    controles.dampingFactor = 0.05;
    controles.enablePan = false;
    controles.enableZoom = true;
    controles.minDistance = 18;
    controles.maxDistance = 90;
    controles.enabled = false;
    controles.autoRotate = false;
    controles.target.set(0, 0, 0);

    const universo = new THREE.Group();
    escena.add(universo);

    function crearCanvasFlor() {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      ctx.translate(128, 128);

      for (let i = 0; i < 14; i++) {
        ctx.save();
        ctx.rotate((i / 14) * Math.PI * 2);

        const grad = ctx.createRadialGradient(0, -50, 5, 0, -50, 40);
        grad.addColorStop(0, "#fff59d");
        grad.addColorStop(0.45, "#ffd43b");
        grad.addColorStop(1, "#d8a300");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, -50, 16, 40, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      const centro = ctx.createRadialGradient(0, 0, 4, 0, 0, 30);
      centro.addColorStop(0, "#7a4a00");
      centro.addColorStop(0.55, "#5c3400");
      centro.addColorStop(1, "#2b1600");

      ctx.fillStyle = centro;
      ctx.beginPath();
      ctx.arc(0, 0, 30, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < 60; i++) {
        const ang = Math.random() * Math.PI * 2;
        const r = Math.random() * 22;
        ctx.fillStyle = "rgba(255, 194, 0, 0.75)";
        ctx.beginPath();
        ctx.arc(Math.cos(ang) * r, Math.sin(ang) * r, 1 + Math.random() * 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      return canvas;
    }

    const canvasFlor = crearCanvasFlor();
    florInicialDOM.style.backgroundImage = `url(${canvasFlor.toDataURL()})`;

    const texturaFlor = new THREE.CanvasTexture(canvasFlor);
    texturaFlor.colorSpace = THREE.SRGBColorSpace;

    const grupoGalaxia = new THREE.Group();
    universo.add(grupoGalaxia);

    const materialCentral = new THREE.SpriteMaterial({
      map: texturaFlor,
      transparent: true,
      opacity: 1,
      depthWrite: false
    });

    const florCentral = new THREE.Sprite(materialCentral);
    florCentral.scale.set(5.5, 5.5, 5.5);
    florCentral.position.set(0, 0, 0);
    grupoGalaxia.add(florCentral);

    const flores = [];
    const totalFlores = window.innerWidth < 700 ? 95 : 145;
    const brazos = 5;
    const porBrazo = Math.ceil(totalFlores / brazos);

    for (let brazo = 0; brazo < brazos; brazo++) {
      for (let i = 0; i < porBrazo; i++) {
        if (flores.length >= totalFlores) break;

        const material = new THREE.SpriteMaterial({
          map: texturaFlor,
          transparent: true,
          opacity: 0,
          depthWrite: false
        });

        const flor = new THREE.Sprite(material);

        const t = i / (porBrazo - 1 || 1);
        const radio = 7 + t * 34 + Math.random() * 1.4;
        const baseAngle = (brazo / brazos) * Math.PI * 2;
        const spiral = radio * 0.5;
        const ruido = (Math.random() - 0.5) * 0.5;
        const angulo = baseAngle + spiral + ruido;

        flor.userData = {
          radio,
          angulo,
          baseY: (Math.random() - 0.5) * 2.2,
          fase: Math.random() * Math.PI * 2,
          targetScale: 0.9 + Math.random() * 1.6,
          velocidad: 0.00055 + Math.random() * 0.00045,
          revelada: false
        };

        flor.position.set(
          Math.cos(angulo) * radio,
          flor.userData.baseY,
          Math.sin(angulo) * radio
        );

        flor.scale.set(0.001, 0.001, 0.001);

        grupoGalaxia.add(flor);
        flores.push(flor);
      }
    }

    const estado = {
      iniciado: false,
      tiempoInicio: 0,
      duracionConstruccion: 6500,
      completo: false
    };

    function clamp(valor, min, max) {
      return Math.min(Math.max(valor, min), max);
    }

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function iniciarAnimacion() {
      if (estado.iniciado) return;

      estado.iniciado = true;
      estado.tiempoInicio = performance.now();

      inicio.classList.add("ocultar");
      setTimeout(() => {
        inicio.style.display = "none";
      }, 950);
    }

    inicio.addEventListener("click", iniciarAnimacion);
    inicio.addEventListener("touchstart", iniciarAnimacion, { passive: true });

    const reloj = new THREE.Clock();

    function animar() {
      requestAnimationFrame(animar);

      const tiempo = reloj.getElapsedTime();

      florCentral.scale.setScalar(5.4 + Math.sin(tiempo * 2.1) * 0.22);

      let progreso = 0;
      let progresoSuave = 0;

      if (estado.iniciado) {
        progreso = clamp((performance.now() - estado.tiempoInicio) / estado.duracionConstruccion, 0, 1);
        progresoSuave = easeOutCubic(progreso);

        camara.position.z = 16 + (60 - 16) * progresoSuave;
        camara.position.y = 0 + 8 * progresoSuave;

        const visibles = Math.floor(flores.length * progresoSuave);

        flores.forEach((flor, index) => {
          if (index < visibles) {
            flor.userData.revelada = true;
          }

          if (flor.userData.revelada) {
            flor.material.opacity += (0.92 - flor.material.opacity) * 0.06;

            const escalaActual = flor.scale.x;
            const escalaObjetivo = flor.userData.targetScale;
            const nuevaEscala = escalaActual + (escalaObjetivo - escalaActual) * 0.07;
            flor.scale.set(nuevaEscala, nuevaEscala, nuevaEscala);
          }

          if (flor.userData.revelada) {
            flor.userData.angulo += flor.userData.velocidad;
            flor.position.x = Math.cos(flor.userData.angulo) * flor.userData.radio;
            flor.position.z = Math.sin(flor.userData.angulo) * flor.userData.radio;
            flor.position.y =
              flor.userData.baseY +
              Math.sin(tiempo * 0.65 + flor.userData.fase) * 0.18;
          }
        });

        grupoGalaxia.rotation.y += 0.0012;

        if (progreso > 0.28) {
          titulo.classList.add("visible");
        }

        if (progreso > 0.55) {
          pie.classList.add("visible");
        }

        if (progreso >= 1 && !estado.completo) {
          estado.completo = true;
          controles.enabled = true;
          controles.autoRotate = true;
          controles.autoRotateSpeed = 0.22;
        }
      } else {
        camara.lookAt(0, 0, 0);
      }

      controles.update();
      renderer.render(escena, camara);
    }

    animar();

    window.addEventListener("resize", () => {
      camara.aspect = window.innerWidth / window.innerHeight;
      camara.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
